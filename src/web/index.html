<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hearth</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2410c'/%3E%3Cpath d='M16 7c3 4 6 6.5 6 11a6 6 0 0 1-12 0c0-2.5 1.2-4 2.6-5.4.2 1.6 1 2.6 2 3 0-3.2.6-5.8 1.4-8.6Z' fill='%23fff7ed'/%3E%3C/svg%3E" />
    <script>
        // Pick the theme before the first paint so a dark window does not flash white.
        (function () {
            var t = 'system';
            try { t = JSON.parse(localStorage.getItem('hearth.theme')) || t; } catch (e) {}
            if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
