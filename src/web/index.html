<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hearth</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <script>
        // Pick the theme before the first paint so a dark window does not flash white.
        (function () {
            var t = 'system';
            try { t = JSON.parse(localStorage.getItem('hearth.theme')) || t; } catch (e) {}
            if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
